---
upgrade:
  - |
    ``FaithfulnessEvaluator`` now requires each statement score returned by the LLM to be the number 0 or 1.
    Invalid scores, such as ``"1"`` or ``5``, could previously interrupt evaluation or distort the mean.
    By default, the evaluator now raises a ``ValueError`` for these inputs.
    Set ``raise_on_failure=False`` to mark them as errors with a NaN score and exclude them from the mean.
